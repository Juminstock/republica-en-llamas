packages:
  - apps/*

# Install scripts we deliberately skip. bufferutil, utf-8-validate and keccak only compile
# optional native speedups for Node and fall back to plain JS; the game runs in the browser.
# @reown/appkit comes in through Privy and is not used directly.
allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  keccak: false
  utf-8-validate: false
